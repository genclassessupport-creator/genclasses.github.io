<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पृष्ठ नहीं मिला — GenClasses</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="preload" as="image" href="/assets/gen-logo-96.webp" type="image/webp">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("gen_theme")==="dark"){document.documentElement.removeAttribute("data-theme");}else{document.documentElement.setAttribute("data-theme","light");}}catch(e){document.documentElement.setAttribute("data-theme","light");}</script>
<style>
:root{--ink0:#060B16;--ink1:#0A1426;--line-2:rgba(217,174,95,.34);--gold:#D9AE5F;--gold-hi:#F2CD88;--cream:#F2EBDA;--mist:#98A6BE;--glass:rgba(255,255,255,.035)}
html[data-theme="light"]{--ink0:#F6F1E4;--ink1:#FFFCF3;--line-2:rgba(143,107,38,.5);--gold:#9A7223;--gold-hi:#7A5A18;--cream:#20180A;--mist:#5A5343;--glass:rgba(111,78,20,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--ink0);color:var(--mist);font-family:'Mukta',sans-serif;padding:28px;text-align:center;position:relative;overflow:hidden}
.wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font-family:'Rozha One',serif;font-size:min(50vw,520px);color:transparent;-webkit-text-stroke:1px rgba(217,174,95,.12);pointer-events:none;user-select:none;line-height:1}
.card{position:relative;max-width:520px;background:var(--glass);border:1px solid var(--line-2);border-radius:22px;padding:44px 34px;backdrop-filter:blur(8px)}
.logo{width:74px;height:74px;border-radius:50%;border:1px solid var(--line-2);box-shadow:0 0 30px rgba(217,174,95,.3);margin-bottom:18px;background:#fff;object-fit:cover;display:block}
.card picture{display:inline-block}
.code{font-family:'Rozha One',serif;font-size:74px;line-height:1;color:var(--gold-hi)}
h1{font-family:'Rozha One',serif;font-weight:400;font-size:28px;color:var(--cream);margin:10px 0 12px}
p{line-height:1.8;font-size:16px}
.btns{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.b{display:inline-block;padding:12px 24px;border-radius:10px;font-weight:700;text-decoration:none;color:var(--ink0);background:linear-gradient(135deg,var(--gold-hi),var(--gold));box-shadow:0 10px 28px rgba(217,174,95,.3)}
html[data-theme="light"] a.b{color:#FFFDF5}
a.g{display:inline-block;padding:12px 24px;border-radius:10px;font-weight:700;text-decoration:none;color:var(--cream);border:1.5px solid var(--line-2)}
</style>
</head>
<body>
<div class="wm" aria-hidden="true">जेन</div>
<div class="card">
  <picture><source srcset="/assets/gen-logo.webp" type="image/webp"><img class="logo" src="/assets/gen-logo.png" width="74" height="74" alt="GenClasses" decoding="async"></picture>
  <div class="code">404</div>
  <h1>यह पृष्ठ यहाँ नहीं है</h1>
  <p>शायद टेस्ट का नाम बदल गया हो या लिंक अधूरा हो। मुखपृष्ठ पर पूरी टेस्ट-सूची और खोज उपलब्ध है।</p>
  <div class="btns"><a class="b" href="/#tests">टेस्ट सीरीज़ देखें</a><a class="g" href="/">मुखपृष्ठ</a></div>
</div>
</body>
</html>
