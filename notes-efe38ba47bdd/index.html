<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="theme-color" content="#f3f1ec">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Notes</title>
<script>try{var _t=localStorage.getItem('bodhi_pen_theme')||'auto';if(_t==='dark'||(_t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.dataset.theme='dark'}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
 --bg:#f3f1ec;--desk:#e2dfd7;--surf:#ffffff;--surf2:#f6f4ef;--glass:rgba(250,249,245,.86);
 --line:rgba(40,32,18,.11);--line2:rgba(40,32,18,.2);--txt:#1e1c18;--mut:#7b766b;
 --acc:#2f5bea;--accbg:rgba(47,91,234,.12);--red:#d63c3c;
 --sh1:0 1px 2px rgba(40,30,10,.08),0 4px 14px rgba(40,30,10,.07);
 --sh2:0 2px 6px rgba(40,30,10,.1),0 18px 44px rgba(40,30,10,.2);
 --pb:#3b3b45;--pb2:#585863;--pw:#ecd3aa;--pm:#b8b8c4;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--tb:62px}
html[data-theme=dark]{
 --bg:#18181b;--desk:#0f0f11;--surf:#26262b;--surf2:#2f2f36;--glass:rgba(32,32,37,.86);
 --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.2);--txt:#f2f1ee;--mut:#9b99a3;
 --acc:#86a7ff;--accbg:rgba(134,167,255,.18);--red:#ff6b6b;
 --sh1:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
 --sh2:0 2px 6px rgba(0,0,0,.5),0 18px 44px rgba(0,0,0,.55);
 --pb:#cfcfd8;--pb2:#a9a9b5;--pw:#ecd3aa;--pm:#84848f}
@media(max-width:959px){:root{--tb:112px}}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Devanagari","Nirmala UI",system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
svg{width:22px;height:22px;flex:none;display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popin{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}

/* ---------- लाइब्रेरी ---------- */
#lib{position:fixed;inset:0;display:none;flex-direction:column}
body[data-mode=lib] #lib{display:flex;animation:fade .25s}
#lh{flex:none;padding:calc(var(--st) + 16px) max(22px,env(safe-area-inset-left)) 14px;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line);z-index:2}
.lrow{display:flex;align-items:center;gap:12px;max-width:1240px;margin:0 auto}
#brand{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
#brand img{width:44px;height:44px;border-radius:12px;box-shadow:var(--sh1)}
#brand .bk{width:44px;height:44px;border-radius:14px;border:none;background:var(--surf);box-shadow:var(--sh1);display:flex;align-items:center;justify-content:center;color:var(--acc);padding:0}
#brand b{display:block;font-size:24px;font-weight:750;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#brand small{display:block;font-size:13px;color:var(--mut);margin-top:1px}
#brand>div{min-width:0}
.gb{flex:none;height:42px;border:none;background:var(--surf);box-shadow:var(--sh1);border-radius:13px;padding:0 15px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.gb.ic{width:42px;padding:0;justify-content:center}
.gb.on{background:var(--acc);color:#fff}
.pb{flex:none;height:42px;border:none;background:var(--acc);color:#fff;border-radius:13px;padding:0 17px 0 13px;font-size:15.5px;font-weight:650;display:inline-flex;align-items:center;gap:6px;box-shadow:0 6px 16px -6px var(--acc)}
html[data-theme=dark] .pb,html[data-theme=dark] .gb.on{color:#10131c}
.pb svg,.gb svg{width:19px;height:19px}
.srch{max-width:1240px;margin:13px auto 0;position:relative}
.srch svg{position:absolute;left:13px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--mut)}
#q{width:100%;border:1px solid transparent;background:var(--surf);box-shadow:var(--sh1);border-radius:13px;padding:11px 14px 11px 40px;font-size:16px;font-family:inherit;color:var(--txt);outline:none}
#q::placeholder{color:var(--mut)}
#q:focus{border-color:var(--acc)}
#ls{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px max(22px,env(safe-area-inset-left)) calc(110px + var(--sb))}
#secs{max-width:1240px;margin:0 auto}
.sec{font-size:13px;font-weight:700;letter-spacing:.4px;color:var(--mut);margin:20px 2px 12px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:26px 20px}
.grid.f{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px 20px}
.card,.fold{position:relative;cursor:pointer;animation:rise .3s both}
.cover{position:relative;aspect-ratio:3/4;transition:transform .18s}
.cover.pdf{border-radius:5px;background:#fff;box-shadow:0 0 0 1px var(--line),3px 3px 0 -1px var(--surf2),3px 3px 0 0 var(--line2),6px 6px 0 -1px var(--surf2),6px 6px 0 0 var(--line2),0 16px 26px -12px rgba(30,22,8,.5);margin:0 6px 6px 0;overflow:hidden}
.cover.pdf img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;pointer-events:none}
.cover.note{border-radius:5px 13px 13px 5px;background:linear-gradient(135deg,color-mix(in srgb,var(--nc) 82%,#fff),var(--nc) 48%,color-mix(in srgb,var(--nc) 76%,#000));box-shadow:0 0 0 1px rgba(0,0,0,.14),0 16px 26px -12px rgba(30,22,8,.6);overflow:hidden;margin:0 6px 6px 0}
.cover.note::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9%;background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(0,0,0,.1) 70%,rgba(255,255,255,.14))}
.cover.note .band{position:absolute;right:11%;top:0;bottom:0;width:5.5%;background:rgba(0,0,0,.3);box-shadow:inset 1px 0 0 rgba(255,255,255,.12)}
.cover.note .plate{position:absolute;left:19%;right:22%;top:17%;background:#fbf8f0;color:#2b2720;border-radius:5px;padding:9px 8px;font-size:13px;font-weight:650;line-height:1.3;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.3),inset 0 0 0 3px #fbf8f0,inset 0 0 0 4px rgba(60,45,20,.28);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cover.note .ptype{position:absolute;left:19%;bottom:9%;font-size:11px;color:rgba(255,255,255,.72);font-weight:600;letter-spacing:.3px}
@media(hover:hover){.card:hover .cover,.fold:hover .fshape{transform:translateY(-4px)}}
.cap{display:flex;align-items:flex-start;gap:2px;margin-top:9px}
.cap .tx{flex:1;min-width:0}
.nm{font-size:14.5px;font-weight:620;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.mini{flex:none;width:30px;height:30px;border:none;background:none;border-radius:9px;color:var(--mut);display:flex;align-items:center;justify-content:center;padding:0;margin-top:-3px}
.mini svg{width:17px;height:17px}
.mini:active{background:var(--accbg)}
.tick{position:absolute;left:8px;top:8px;width:27px;height:27px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 1.5px var(--line2),0 2px 6px rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;color:transparent;z-index:1}
.tick svg{width:16px;height:16px;stroke-width:2.6}
body.selmode .tick{display:flex}body.selmode .mini{visibility:hidden}
.card.sel .tick{background:var(--acc);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.card.sel .cover{transform:scale(.95)}
.fshape{position:relative;aspect-ratio:4/3;margin-top:13px;border-radius:5px 13px 13px 13px;background:color-mix(in srgb,var(--fc) 78%,#000);box-shadow:0 14px 22px -12px rgba(30,22,8,.55);transition:transform .18s}
.fshape .tab{position:absolute;left:0;top:-11px;width:40%;height:18px;border-radius:9px 11px 0 0;background:color-mix(in srgb,var(--fc) 78%,#000)}
.fshape img{position:absolute;width:40%;aspect-ratio:3/4;object-fit:cover;object-position:top;background:#fff;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.35);top:7%;pointer-events:none}
.fshape img.p1{left:13%;transform:rotate(-5deg)}.fshape img.p2{left:43%;transform:rotate(4deg)}
.fshape .front{position:absolute;left:0;right:0;bottom:0;top:40%;border-radius:11px 11px 13px 13px;background:linear-gradient(170deg,color-mix(in srgb,var(--fc) 86%,#fff),var(--fc));box-shadow:0 -2px 6px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.45);display:flex;align-items:flex-end;padding:0 12px 9px;font-size:12.5px;font-weight:650;color:rgba(40,26,0,.7)}
#empty{text-align:center;color:var(--mut);padding:8vh 20px 0;line-height:1.75;font-size:16.5px;max-width:460px;margin:0 auto}
#empty>svg{width:150px;height:130px;margin:0 auto 14px}
#empty b{display:block;font-size:22px;color:var(--txt);margin-bottom:6px;font-weight:720}
#empty .pb{margin-top:20px;height:48px;font-size:16.5px;padding:0 22px 0 16px}
body.drag #ls{outline:3px dashed var(--acc);outline-offset:-12px}
#selbar{position:absolute;left:50%;bottom:calc(18px + var(--sb));transform:translate(-50%,140%);transition:transform .25s cubic-bezier(.3,1.3,.5,1);background:var(--surf);box-shadow:var(--sh2);border-radius:18px;padding:8px;display:flex;align-items:center;gap:6px;z-index:5;max-width:94vw}
body.selmode #selbar{transform:translate(-50%,0)}
#selbar span{padding:0 12px;font-weight:650;white-space:nowrap;font-size:15px}
#selbar button{border:none;background:var(--surf2);border-radius:12px;height:42px;padding:0 14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
#selbar button.danger{color:var(--red)}
#selbar svg{width:18px;height:18px}

/* ---------- संपादक ---------- */
#ed{position:fixed;inset:0;display:none;background:var(--desk)}
body[data-mode=ed] #ed{display:block;animation:fade .25s}
#tb{position:absolute;left:0;right:0;top:0;height:calc(var(--tb) + var(--st));padding:var(--st) 10px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line);z-index:20}
.tl,.tr{display:flex;align-items:center;gap:2px;min-width:0}
.tr{justify-content:flex-end}
#dtitle{min-width:0;font-size:15.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 8px;border-radius:10px;border:none;background:none;max-width:100%}
#dockw{min-width:0;overflow-x:auto;scrollbar-width:none;display:flex;padding:4px 4px 6px}
#dockw::-webkit-scrollbar{display:none}
#dock{margin:0 auto;display:flex;align-items:center;height:48px;background:var(--surf);border-radius:16px;box-shadow:var(--sh1),0 0 0 1px var(--line);padding:0 8px;flex:none}
@media(max-width:959px){#tb{grid-template-columns:1fr auto;grid-template-rows:50px 62px;gap:0 8px}#dockw{grid-column:1/-1;grid-row:2}}
.tools{display:flex;align-items:flex-end;height:48px;overflow:hidden;padding:0 2px}
.tool{flex:none;width:39px;height:48px;border:none;background:none;padding:0;display:flex;justify-content:center;align-items:flex-end;transform:translateY(16px);transition:transform .22s cubic-bezier(.3,1.5,.5,1),opacity .2s;opacity:.72}
.tool svg{width:30px;height:50px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}
.tool.on{transform:translateY(2px);opacity:1}
.ib{flex:none;width:42px;height:42px;border:none;background:none;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--txt)}
.ib:active{background:var(--accbg)}
@media(hover:hover){.ib:hover{background:var(--accbg)}}
.ib.on{background:var(--accbg);color:var(--acc)}
.ib:disabled{opacity:.28;background:none}
.sep{flex:none;width:1px;height:26px;background:var(--line);margin:0 7px}
.grp{display:flex;align-items:center;gap:1px;flex:none}
.sz{flex:none;width:38px;height:38px;border:none;background:none;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--txt)}
.sz svg{width:26px;height:18px}
.sz.on{background:var(--accbg);color:var(--acc)}
.co{flex:none;width:34px;height:38px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.co::before{content:"";width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.16),inset 0 2px 3px rgba(255,255,255,.3);transition:transform .15s}
.co.on::before{box-shadow:0 0 0 2.5px var(--surf),0 0 0 4.5px var(--acc);transform:scale(.92)}
.co.add::before{background:conic-gradient(#ff5a5a,#ffcf4a,#5ad76a,#4ab8ff,#9a6bff,#ff5ab0,#ff5a5a)}
#cp{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
#view{position:absolute;left:0;right:0;bottom:0;top:calc(var(--tb) + var(--st));overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
#pages{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 12px 120px;width:max-content;min-width:100%;will-change:transform}
.pg{position:relative;background:#fff;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 2px 5px rgba(20,16,8,.14),0 14px 30px -10px rgba(20,16,8,.28);flex:none;overflow:hidden;cursor:crosshair}
.pg canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;display:block}
.pg canvas.hl{opacity:.4;mix-blend-mode:multiply}
body.finger .pg{touch-action:none}
body.night .pg{filter:invert(.9) hue-rotate(180deg)}
#ov{position:absolute;left:0;top:calc(var(--tb) + var(--st));pointer-events:none;z-index:10}
#addpg{flex:none;border:2px dashed var(--line2);background:none;border-radius:16px;padding:16px 30px;color:var(--mut);font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center}
#fs{position:absolute;right:5px;top:0;width:34px;height:60px;z-index:16;border:none;border-radius:17px;background:var(--surf);box-shadow:var(--sh2);display:flex;align-items:center;justify-content:center;color:var(--mut);touch-action:none;opacity:0;pointer-events:none;transition:opacity .25s;padding:0}
#fs::before{content:"";position:absolute;inset:-10px -6px -10px -14px}
#fs.show{opacity:1;pointer-events:auto}
#fs.drag{background:var(--acc);color:#fff;opacity:1}
#fs svg{width:20px;height:20px}
#fsb{position:absolute;right:50px;top:0;z-index:16;background:rgba(22,22,30,.92);color:#fff;border-radius:14px;padding:10px 16px;font-size:18px;font-weight:700;white-space:nowrap;pointer-events:none;display:none}
#fsb.show{display:block}
#pill{position:absolute;left:50%;bottom:calc(16px + var(--sb));transform:translateX(-50%);z-index:15;border:none;background:var(--glass);color:var(--txt);border-radius:22px;height:40px;padding:0 16px 0 12px;font-size:14.5px;font-weight:650;-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);box-shadow:var(--sh1),0 0 0 1px var(--line);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
#pill svg{width:17px;height:17px;color:var(--mut)}
#zc{position:absolute;right:16px;bottom:calc(16px + var(--sb));z-index:15;display:none;align-items:center;height:40px;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--sh1),0 0 0 1px var(--line);padding:0 4px;font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums}
#zc button{width:34px;height:34px;border:none;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
#zc button:hover{background:var(--accbg)}#zc svg{width:17px;height:17px}#zc b{min-width:46px;text-align:center;font-weight:650}
@media(hover:hover) and (pointer:fine){#zc{display:flex}}
#pgrid{position:absolute;left:0;right:0;bottom:0;top:calc(var(--tb) + var(--st));z-index:18;background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);display:none;flex-direction:column}
#pgrid.show{display:flex;animation:fade .2s}
#pgh{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px;font-size:19px;font-weight:720}
#pgb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 20px calc(30px + var(--sb));display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:18px 16px;align-content:start}
.pt{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mut);font-size:13px;font-weight:650}
.pt .ph{display:block;width:100%;background:#fff;border-radius:4px;box-shadow:0 0 0 1px var(--line),0 6px 14px -6px rgba(20,16,8,.4);overflow:hidden;position:relative}
.pt .ph canvas{position:absolute;inset:0;width:100%;height:100%}
.pt.cur .ph{box-shadow:0 0 0 3px var(--acc),0 6px 14px -6px rgba(20,16,8,.4)}
.pt.cur{color:var(--acc)}
body.night .pt .ph{filter:invert(.9) hue-rotate(180deg)}

/* ---------- पॉपओवर, संवाद, सूचना ---------- */
.pop{position:fixed;z-index:60;background:var(--surf);color:var(--txt);border-radius:18px;box-shadow:var(--sh2),0 0 0 1px var(--line);padding:6px;min-width:210px;max-width:92vw;max-height:80vh;overflow:auto;animation:popin .16s cubic-bezier(.3,1.3,.5,1);transform-origin:top center}
.pop.menu button{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:12px 14px;font-size:16px;border-radius:12px;text-align:left}
.pop.menu button:active{background:var(--accbg)}
@media(hover:hover){.pop.menu button:hover{background:var(--surf2)}}
.pop.menu button.danger{color:var(--red)}
.pop.menu svg{width:20px;height:20px;color:var(--mut)}
.pop.menu button.danger svg{color:var(--red)}
.pop.menu .dot{width:18px;height:18px;border-radius:50%;flex:none;margin:1px}
.pop.menu hr{border:none;border-top:1px solid var(--line);margin:4px 10px}
.pop.opts{padding:16px;width:288px}
.pop.opts label{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-bottom:6px}
.pop.opts label b{color:var(--txt)}
.pop.opts input[type=range]{width:100%;margin:0 0 6px;accent-color:var(--acc)}
.pop.opts .rowb{display:flex;align-items:center;justify-content:space-between;padding:10px 0 2px;font-size:15.5px;gap:12px}
.pop.opts .tip{color:var(--mut);font-size:13.5px;line-height:1.55;padding-top:10px}
.sw{flex:none;width:48px;height:28px;border-radius:14px;border:none;background:var(--line2);position:relative;padding:0;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px)}
.seg{display:flex;background:var(--surf2);border-radius:11px;padding:3px;margin-top:10px}
.seg button{flex:1;border:none;background:none;padding:9px 6px;border-radius:9px;font-size:14.5px}
.seg button.on{background:var(--surf);box-shadow:0 1px 3px rgba(0,0,0,.2);font-weight:650}

let tT=null;
function toast(m,ms=2200){const t=$('#toast');if(!m){t.classList.remove('show');return}t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),ms)}
let popEl=null;
function popOut(e){if(popEl&&!popEl.contains(e.target))closePop()}
let popAt=-1e9;
function closePop(){if(popEl){popAt=performance.now();popEl.remove();popEl=null;document.removeEventListener('pointerdown',popOut,true)}}
function showPop(anchor,node){closePop();document.body.appendChild(node);const r=anchor.getBoundingClientRect(),w=node.offsetWidth,h=node.offsetHeight;
 let x=clamp(r.left+r.width/2-w/2,8,innerWidth-w-8),y=r.bottom+8;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);
 node.style.left=x+'px';node.style.top=y+'px';popEl=node;setTimeout(()=>{if(popEl===node)document.addEventListener('pointerdown',popOut,true)},0)}
function menu(anchor,items){const m=el('div','pop menu');items.forEach(it=>{if(!it)return;if(it==='-'){m.appendChild(el('hr'));return}
 const b=el('button',it.danger?'danger':'',(it.icon||'')+'<span>'+esc(it.label)+'</span>');b.onclick=()=>{closePop();it.fn()};m.appendChild(b)});showPop(anchor,m)}
function dialog(o){return new Promise(res=>{closePop();const w=el('div','dlgw'),d=el('div','dlg');w.appendChild(d);
 let h='<h3>'+esc(o.title)+'</h3>'+(o.text?'<p>'+esc(o.text)+'</p>':'');
 if(o.input!=null)h+='<input type="text" maxlength="80">';
 if(o.choices)h+='<div class="seg">'+o.choices.map((c,i)=>'<button data-v="'+c[0]+'" class="'+(i?'':'on')+'">'+esc(c[1])+'</button>').join('')+'</div>';
 h+='<div class="acts"><button class="no">Cancel</button><button class="yes '+(o.danger?'danger':'')+'">'+esc(o.ok||'OK')+'</button></div>';d.innerHTML=h;
 const inp=d.querySelector('input');let choice=o.choices?o.choices[0][0]:null;
 d.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{choice=b.dataset.v;d.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b))});
 if(inp){inp.value=o.input;setTimeout(()=>{inp.focus();inp.select()},60)}
 const done=v=>{w.remove();res(v)};
 const yes=()=>{if(inp&&!inp.value.trim()){inp.focus();return}done(o.choices?{text:inp?inp.value.trim():'',choice}:inp?inp.value.trim():true)};
 d.querySelector('.no').onclick=()=>done(null);d.querySelector('.yes').onclick=yes;
 w.addEventListener('pointerdown',e=>{if(e.target===w)done(null)});if(inp)inp.onkeydown=e=>{if(e.key==='Enter')yes()};
 document.body.appendChild(w)})}

/* ---------- डिवाइस में सुरक्षित भंडार ---------- */
const DB=(()=>{let p;
 const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('bodhi-pen2',1);
  r.onupgradeneeded=()=>{for(const s of['docs','files','ink','folders'])r.result.createObjectStore(s)};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const run=async(stores,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(stores,mode);let out;
  t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(t.error);out=fn(...[].concat(stores).map(s=>t.objectStore(s)))})};
 return{run,
  get:(s,k)=>run(s,'readonly',st=>st.get(k)).then(q=>q.result),
  all:s=>run(s,'readonly',st=>st.getAll()).then(q=>q.result),
  put:(s,k,v)=>run(s,'readwrite',st=>{st.put(v,k)}),
  del:(s,k)=>run(s,'readwrite',st=>{st.delete(k)})}})();
const inkRange=id=>IDBKeyRange.bound([id,0],[id,1e9]);

   c.style.animationDelay=Math.min(k++*18,260)+'ms';

 const bg=document.createElement('canvas');bg.className='bg';bg.width=Math.round(P.w*k);bg.height=Math.round(P.h*k);

 if(E.pdf)getPage(P).then(pg=>{if(P.cv!==cv||cv.tok!==tok){bg.width=bg.height=0;return}
   const task=pg.render({canvasContext:bg.getContext('2d'),viewport:pg.getViewport({scale:k})});P.task=task;
   task.promise.then(()=>{if(P.task===task)P.task=null;done()}).catch(()=>{bg.width=bg.height=0})}).catch(()=>{});

function paperMarks(P){const Ln=[],D=[],w=P.w,h=P.h;

const fingers=e=>[...e.touches].filter(t=>t.touchType!=='stylus');
const tdist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
function cancelCur(){const c=cur;if(!c)return;cur=null;clearTimeout(c.hold);if(c.lz){c.lz.end=performance.now()}else if(c.tool==='erase'){c.P.strokes=c.before;redraw(c.P)}else if(c.s&&c.s.t==='pen'&&!c.line)redraw(c.P);reqPaint()}
view.addEventListener('touchstart',e=>{
 if([...e.changedTouches].some(t=>t.touchType==='stylus')){if(e.cancelable)e.preventDefault();return}
 if(penDown||performance.now()-lastPenUp<280){if(e.cancelable)e.preventDefault();return}
 const f=fingers(e);
 if(f.length===1&&S.finger&&e.target.closest('.pg')){if(e.cancelable)e.preventDefault();return}
 if(f.length===2){
  if(!e.cancelable){gest=null;return}
  e.preventDefault();if(cur&&cur.touch)cancelCur();
  const br=box.getBoundingClientRect(),cx=(f[0].clientX+f[1].clientX)/2,cy=(f[0].clientY+f[1].clientY)/2;
  gest={d:tdist(f[0],f[1]),cx,cy,s:1,dx:0,dy:0,t:performance.now(),moved:false};box.style.transformOrigin=(cx-br.left)+'px '+(cy-br.top)+'px';
 }else if(f.length===3){if(e.cancelable)e.preventDefault();if(gest){gest=null;box.style.transform=''}tri={t:performance.now(),x:f[0].clientX,y:f[0].clientY,moved:false}}
},{passive:false});
view.addEventListener('touchmove',e=>{
 if(penDown&&e.cancelable){e.preventDefault();return}
 const f=fingers(e);
 if(tri&&f[0]&&Math.hypot(f[0].clientX-tri.x,f[0].clientY-tri.y)>14)tri.moved=true;
 if(!gest||f.length!==2)return;if(e.cancelable)e.preventDefault();
 const g=gest,d=tdist(f[0],f[1]);g.dx=(f[0].clientX+f[1].clientX)/2-g.cx;g.dy=(f[0].clientY+f[1].clientY)/2-g.cy;
 if(Math.abs(d-g.d)>12||Math.hypot(g.dx,g.dy)>12)g.moved=true;
 if(g.moved){g.s=clamp(d/g.d,.25/zoom,6/zoom);box.style.transform='translate('+g.dx+'px,'+g.dy+'px) scale('+g.s+')'}
},{passive:false});
function touchEnd(e){
 if(tri&&e.touches.length===0){if(!tri.moved&&performance.now()-tri.t<400)redo();tri=null}
 if(!gest||fingers(e).length>=2)return;
 const g=gest;gest=null;box.style.transform='';
 if(g.moved){const z0=zoom;setZoom(zoom*g.s,g.cx,g.cy);view.scrollLeft-=g.dx;view.scrollTop-=g.dy;if(Math.abs(zoom/z0-1)>.03)toast(Math.round(zoom*100)+'%',700)}
 else if(performance.now()-g.t<320)undo()}
view.addEventListener('touchend',touchEnd);view.addEventListener('touchcancel',touchEnd);

/* ----- छोटी तस्वीर ----- */
async function makeThumb(pdfPage,P,strokes){
 const sc=300/P.w,c=document.createElement('canvas');c.width=Math.round(P.w*sc);c.height=Math.round(P.h*sc);const ctx=c.getContext('2d');
 ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
 if(pdfPage)await pdfPage.render({canvasContext:ctx,viewport:pdfPage.getViewport({scale:sc})}).promise;else drawPaper(ctx,P,sc);
 inkOnto(ctx,c,strokes,sc);const u=c.toDataURL('image/jpeg',.74);c.width=c.height=0;return u}
function inkOnto(ctx,c,strokes,sc){
 const hs=strokes.filter(s=>s.t==='hl');
 if(hs.length){const h=document.createElement('canvas');h.width=c.width;h.height=c.height;const hc=h.getContext('2d');hs.forEach(s=>drawStroke(hc,s,sc));
  ctx.save();ctx.globalAlpha=HL_A;ctx.globalCompositeOperation='multiply';ctx.drawImage(h,0,0);ctx.restore();h.width=h.height=0}
 strokes.filter(s=>s.t==='pen').forEach(s=>drawStroke(ctx,s,sc))}

/* ----- लिखी हुई PDF बनाना ----- */
const hex2rgb=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255]};
async function exportVector(){
 const {PDFDocument,rgb,LineCapStyle,BlendMode}=PDFLib,note=E.doc.kind==='note';
 const pd=note?await PDFDocument.create():await PDFDocument.load(E.bytes,{ignoreEncryption:true});const pp=note?[]:pd.getPages();
 for(let i=0;i<E.pages.length;i++){
  const P=E.pages[i];let page,cv;
  if(note){page=pd.addPage([P.w,P.h]);cv=(x,y)=>({x,y:P.h-y});const m=paperMarks(P);page.drawRectangle({x:0,y:0,width:P.w,height:P.h,color:rgb(1,.996,.98)});
   m.Ln.forEach(l=>page.drawLine({start:cv(l[0],l[1]),end:cv(l[2],l[3]),thickness:.7,color:rgb(.8,.84,.9)}));m.D.forEach(d=>page.drawCircle({x:d[0],y:P.h-d[1],size:.9,color:rgb(.73,.76,.83)}))}
  else{if(!P.strokes.length||!pp[i])continue;page=pp[i];const vp=(await getPage(P)).getViewport({scale:1});cv=(x,y)=>{const r=vp.convertToPdfPoint(x,y);return{x:r[0],y:r[1]}}}
  for(const s of P.strokes){if(s.t!=='hl')continue;
   let d='';s.p.forEach((q,j)=>{const c=cv(q[0],q[1]);d+=(j?'L':'M')+c.x.toFixed(2)+' '+(-c.y).toFixed(2)+' '});
   page.drawSvgPath(d,{x:0,y:0,borderColor:rgb(...hex2rgb(s.c)),borderWidth:s.w,borderOpacity:HL_A,borderLineCap:LineCapStyle.Round,blendMode:BlendMode.Multiply})}
  for(const s of P.strokes){if(s.t!=='pen')continue;const col=rgb(...hex2rgb(s.c)),p=s.p;
   if(p.length===1){const c=cv(p[0][0],p[0][1]);page.drawCircle({x:c.x,y:c.y,size:s.w*wf(p[0][2])/2,color:col});continue}
   if(isUni(s)){let d='';p.forEach((q,j)=>{const c=cv(q[0],q[1]);d+=(j?'L':'M')+c.x.toFixed(2)+' '+(-c.y).toFixed(2)+' '});
    page.drawSvgPath(d,{x:0,y:0,borderColor:col,borderWidth:s.w*wf(p[0][2]),borderLineCap:LineCapStyle.Round});continue}
   for(let j=1;j<p.length;j++)page.drawLine({start:cv(p[j-1][0],p[j-1][1]),end:cv(p[j][0],p[j][1]),thickness:s.w*wf((p[j-1][2]+p[j][2])/2),color:col,lineCap:LineCapStyle.Round})}
  if(i%4===0){toast('Creating PDF… '+(i+1)+' / '+E.pages.length,60000);await sleep(0)}}
 return new Blob([await pd.save()],{type:'application/pdf'})}
async function exportRaster(){
 const {jsPDF}=window.jspdf;let out=null;
 for(let i=0;i<E.pages.length;i++){const P=E.pages[i];toast('Creating PDF… '+(i+1)+' / '+E.pages.length,60000);
  const sc=Math.min(2,Math.sqrt(7e6/(P.w*P.h))),c=document.createElement('canvas');c.width=Math.round(P.w*sc);c.height=Math.round(P.h*sc);const ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);await (await getPage(P)).render({canvasContext:ctx,viewport:P.page.getViewport({scale:sc})}).promise;
  inkOnto(ctx,c,P.strokes,sc);const o=P.w>P.h?'l':'p';
  if(!out)out=new jsPDF({orientation:o,unit:'pt',format:[P.w,P.h],compress:true});else out.addPage([P.w,P.h],o);
  out.addImage(c.toDataURL('image/jpeg',.88),'JPEG',0,0,P.w,P.h,undefined,'FAST');c.width=c.height=0;await sleep(0)}
 return out.output('blob')}
async function exportPdf(){
 if(!E.doc||busy)return;busy=true;toast('Creating PDF…',60000);
 try{try{lastBlob=await exportVector()}catch(e){console.warn(e);if(E.doc.kind==='note')throw e;lastBlob=await exportRaster()}
  toast('');const name=E.doc.name+' - notes.pdf';
  if(await dialog({title:'PDF is ready',text:'Save "'+name+'" to Files or share it.',ok:'Save / share'})){
   const f=new File([lastBlob],name,{type:'application/pdf'});
   if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name})}catch(e){if(e.name!=='AbortError')download(lastBlob,name)}}else download(lastBlob,name)}}
 catch(e){console.error(e);toast('Could not create the PDF. Please try again.',3000)}
 finally{busy=false}}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},8000)}

document.addEventListener('selectstart',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
renderBar();loadLib().catch(e=>{console.error(e);toast('This browser cannot save files. If this is a Private tab, open the link in a normal tab.',8000)});
</script>
