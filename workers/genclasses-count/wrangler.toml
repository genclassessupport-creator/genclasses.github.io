name = "genclasses-count"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

[[routes]]
pattern = "count.genclasses.com"
custom_domain = true

[durable_objects]
bindings = [{ name = "COUNTER", class_name = "VisitCounter" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisitCounter"]
